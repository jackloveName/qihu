workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 27.2
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.app.qihu
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        IPA_NAME: qihu.ipa
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify iOS build SDK
        script: |
          set -eu
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "iOS SDK version: $SDK_VERSION"
          if [ "$SDK_MAJOR" -lt 27 ]; then
            echo "iOS 27 SDK or newer is required for App Store submission."
            exit 1
          fi
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build and name qihu.ipa
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --clean

          mkdir -p build/ios/ipa
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated"
            exit 1
          fi

          TARGET_IPA="build/ios/ipa/$IPA_NAME"
          if [ "$IPA_PATH" != "$TARGET_IPA" ]; then
            mv -f "$IPA_PATH" "$TARGET_IPA"
          fi

          test -f "$TARGET_IPA"
          if [ "$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "Expected exactly one IPA artifact"
            find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print
            exit 1
          fi
          ls -lh "$TARGET_IPA"
    artifacts:
      - build/ios/ipa/$IPA_NAME
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
