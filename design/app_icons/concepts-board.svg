<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1260" viewBox="0 0 1480 1260">
  <defs>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientTransform="translate(1320 70) rotate(132) scale(560)">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageShade" cx="0" cy="0" r="1" gradientTransform="translate(100 1210) rotate(-42) scale(530)">
      <stop stop-color="#C6D7CB" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C6D7CB" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#15211C" flood-opacity=".055"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#12261F" flood-opacity=".2"/>
    </filter>
    <clipPath id="clip1"><rect x="163" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip2"><rect x="616" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip3"><rect x="1069" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip4"><rect x="163" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip5"><rect x="616" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip6"><rect x="1069" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="small1"><rect x="332" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small2"><rect x="785" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small3"><rect x="1238" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small4"><rect x="332" y="1022" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small5"><rect x="785" y="1022" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small6"><rect x="1238" y="1022" width="53" height="53" rx="13"/></clipPath>
  </defs>

  <rect width="1480" height="1260" fill="#EFEDE4"/>
  <rect width="1480" height="1260" fill="url(#pageGlow)"/>
  <rect width="1480" height="1260" fill="url(#pageShade)"/>

  <text x="72" y="66" fill="#6C7B73" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">栖护 · APP ICON DIRECTIONS</text>
  <text x="70" y="118" fill="#15211C" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="43" font-weight="700" letter-spacing="-.8">六款 App 图标方案</text>
  <text x="1408" y="72" fill="#68756E" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end">沿用森林绿、暖米色与黄铜色</text>
  <text x="1408" y="99" fill="#68756E" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end">少元素、高识别，兼顾桌面尺寸</text>

  <g filter="url(#cardShadow)">
    <rect x="72" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="525" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="978" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="72" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="525" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="978" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
  </g>

  <rect x="98" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="551" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="1004" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="98" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="551" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="1004" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>

  <g filter="url(#iconShadow)">
    <image href="app-icon-1-forest-paw.png" x="163" y="247" width="200" height="200" clip-path="url(#clip1)"/>
    <image href="app-icon-2-warm-home.png" x="616" y="247" width="200" height="200" clip-path="url(#clip2)"/>
    <image href="app-icon-3-two-pets.png" x="1069" y="247" width="200" height="200" clip-path="url(#clip3)"/>
    <image href="app-icon-4-leaf-care.png" x="163" y="782" width="200" height="200" clip-path="url(#clip4)"/>
    <image href="app-icon-5-gold-seal.png" x="616" y="782" width="200" height="200" clip-path="url(#clip5)"/>
    <image href="app-icon-6-cat-sun.png" x="1069" y="782" width="200" height="200" clip-path="url(#clip6)"/>
  </g>

  <g font-family="SF Mono, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#A2854A">
    <text x="98" y="179">01</text><text x="551" y="179">02</text><text x="1004" y="179">03</text>
    <text x="98" y="714">04</text><text x="551" y="714">05</text><text x="1004" y="714">06</text>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="600" letter-spacing=".4" fill="#7B857F" text-anchor="end">
    <text x="476" y="179">主推 · 高识别</text><text x="929" y="179">品牌稳重</text><text x="1382" y="179">多宠用户</text>
    <text x="476" y="714">自然疗愈</text><text x="929" y="714">精致质感</text><text x="1382" y="714">亲和可爱</text>
  </g>

  <g font-family="Songti SC, Noto Serif CJK SC, serif" font-size="23" font-weight="700" fill="#15211C">
    <text x="98" y="500">森语爪印</text><text x="551" y="500">暖屋相伴</text><text x="1004" y="500">双宠依偎</text>
    <text x="98" y="1035">叶脉守护</text><text x="551" y="1035">金环印记</text><text x="1004" y="1035">暖光猫脸</text>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7770">
    <text x="98" y="525">爪印与叶形融合，正面表达宠物照护。</text><text x="98" y="545">深色底最醒目，缩到小尺寸仍然清楚。</text>
    <text x="551" y="525">用屋檐、猫咪和暖阳概括“在家照护”。</text><text x="551" y="545">形象友好，也最适合讲品牌故事。</text>
    <text x="1004" y="525">猫与犬并肩出现，强调多宠物家庭。</text><text x="1004" y="545">轮廓差异明显，信息量更丰富。</text>
    <text x="98" y="1060">叶片像一枚养护徽章，爪印与枝脉相连。</text><text x="98" y="1080">色调最轻，偏向温柔有呼吸感的路线。</text>
    <text x="551" y="1060">用黄铜细框把爪印做成私人养护印记。</text><text x="551" y="1080">最克制成熟，适合扩展会员体系。</text>
    <text x="1004" y="1060">表情最直接、情绪最亲和。</text><text x="1004" y="1080">第一眼就传递可爱与陪伴感。</text>
  </g>

  <image href="app-icon-1-forest-paw.png" x="332" y="487" width="53" height="53" clip-path="url(#small1)"/>
  <image href="app-icon-2-warm-home.png" x="785" y="487" width="53" height="53" clip-path="url(#small2)"/>
  <image href="app-icon-3-two-pets.png" x="1238" y="487" width="53" height="53" clip-path="url(#small3)"/>
  <image href="app-icon-4-leaf-care.png" x="332" y="1022" width="53" height="53" clip-path="url(#small4)"/>
  <image href="app-icon-5-gold-seal.png" x="785" y="1022" width="53" height="53" clip-path="url(#small5)"/>
  <image href="app-icon-6-cat-sun.png" x="1238" y="1022" width="53" height="53" clip-path="url(#small6)"/>

  <text x="72" y="1230" fill="#77827B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12">预览已检查 iOS 圆角裁切与桌面小尺寸</text>
  <text x="1408" y="1230" fill="#77827B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="end">栖护品牌色 · #12392F / #C6A663 / #F4EAD8</text>
</svg>
