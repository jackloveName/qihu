<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1260" viewBox="0 0 1480 1260">
  <defs>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientTransform="translate(1320 70) rotate(132) scale(560)">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageShade" cx="0" cy="0" r="1" gradientTransform="translate(100 1210) rotate(-42) scale(530)">
      <stop stop-color="#C6D7CB" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C6D7CB" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#15211C" flood-opacity=".055"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#12261F" flood-opacity=".2"/>
    </filter>
    <clipPath id="clip1"><rect x="163" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip2"><rect x="616" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip3"><rect x="1069" y="247" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip4"><rect x="163" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip5"><rect x="616" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="clip6"><rect x="1069" y="782" width="200" height="200" rx="47"/></clipPath>
    <clipPath id="small1"><rect x="332" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small2"><rect x="785" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small3"><rect x="1238" y="487" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small4"><rect x="332" y="1022" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small5"><rect x="785" y="1022" width="53" height="53" rx="13"/></clipPath>
    <clipPath id="small6"><rect x="1238" y="1022" width="53" height="53" rx="13"/></clipPath>
  </defs>

  <rect width="1480" height="1260" fill="#EFEDE4"/>
  <rect width="1480" height="1260" fill="url(#pageGlow)"/>
  <rect width="1480" height="1260" fill="url(#pageShade)"/>

  <text x="72" y="66" fill="#6C7B73" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">栖护 · APP ICON DIRECTIONS / ROUND 2</text>
  <text x="70" y="118" fill="#15211C" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="43" font-weight="700" letter-spacing="-.8">另一组图标方向</text>
  <text x="1408" y="72" fill="#68756E" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end">不止换配色，也更换核心符号</text>
  <text x="1408" y="99" fill="#68756E" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="end">重点尝试任务、时间与陪伴表达</text>

  <g filter="url(#cardShadow)">
    <rect x="72" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="525" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="978" y="165" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="72" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="525" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
    <rect x="978" y="700" width="430" height="500" rx="28" fill="#FCFBF7" fill-opacity=".9" stroke="#D9D5C7"/>
  </g>

  <rect x="98" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="551" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="1004" y="190" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="98" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="551" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>
  <rect x="1004" y="725" width="378" height="266" rx="22" fill="#E7E3D8"/>

  <g filter="url(#iconShadow)">
    <image href="app-icon-7-care-calendar.png" x="163" y="247" width="200" height="200" clip-path="url(#clip1)"/>
    <image href="app-icon-8-cat-clock.png" x="616" y="247" width="200" height="200" clip-path="url(#clip2)"/>
    <image href="app-icon-9-big-ears.png" x="1069" y="247" width="200" height="200" clip-path="url(#clip3)"/>
    <image href="app-icon-10-leaf-house.png" x="163" y="782" width="200" height="200" clip-path="url(#clip4)"/>
    <image href="app-icon-11-heart-paw.png" x="616" y="782" width="200" height="200" clip-path="url(#clip5)"/>
    <image href="app-icon-12-sun-steps.png" x="1069" y="782" width="200" height="200" clip-path="url(#clip6)"/>
  </g>

  <g font-family="SF Mono, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#A2854A">
    <text x="98" y="179">07</text><text x="551" y="179">08</text><text x="1004" y="179">09</text>
    <text x="98" y="714">10</text><text x="551" y="714">11</text><text x="1004" y="714">12</text>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="600" letter-spacing=".4" fill="#7B857F" text-anchor="end">
    <text x="476" y="179">功能清晰</text><text x="929" y="179">提醒陪伴</text><text x="1382" y="179">强识别</text>
    <text x="476" y="714">自然疗愈</text><text x="929" y="714">情感表达</text><text x="1382" y="714">记录成长</text>
  </g>

  <g font-family="Songti SC, Noto Serif CJK SC, serif" font-size="23" font-weight="700" fill="#15211C">
    <text x="98" y="500">日签守护</text><text x="551" y="500">猫耳时钟</text><text x="1004" y="500">大耳剪影</text>
    <text x="98" y="1035">叶脉栖居</text><text x="551" y="1035">心爪印记</text><text x="1004" y="1035">日光足迹</text>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" fill="#6B7770">
    <text x="98" y="525">日历、爪印与完成勾合在一起。</text><text x="98" y="545">功能最明确，适合强调每日照护。</text>
    <text x="551" y="525">猫耳与时钟融合，保留时间提醒语义。</text><text x="551" y="545">温和但比普通闹钟更有宠物感。</text>
    <text x="1004" y="525">高对比、纯剪影、夸张大耳朵。</text><text x="1004" y="545">远距离识别最强，也最可爱直白。</text>
    <text x="98" y="1060">叶片、叶脉和爪印组成自然徽章。</text><text x="98" y="1080">最安静克制，偏向养护与疗愈。</text>
    <text x="551" y="1060">心形承载爪印，情感表达最直接。</text><text x="551" y="1080">温柔、有记忆点，适合陪伴定位。</text>
    <text x="1004" y="1060">一串足迹走向太阳，表示慢慢成长。</text><text x="1004" y="1080">最轻快，强调记录和长期陪伴。</text>
  </g>

  <image href="app-icon-7-care-calendar.png" x="332" y="487" width="53" height="53" clip-path="url(#small1)"/>
  <image href="app-icon-8-cat-clock.png" x="785" y="487" width="53" height="53" clip-path="url(#small2)"/>
  <image href="app-icon-9-big-ears.png" x="1238" y="487" width="53" height="53" clip-path="url(#small3)"/>
  <image href="app-icon-10-leaf-house.png" x="332" y="1022" width="53" height="53" clip-path="url(#small4)"/>
  <image href="app-icon-11-heart-paw.png" x="785" y="1022" width="53" height="53" clip-path="url(#small5)"/>
  <image href="app-icon-12-sun-steps.png" x="1238" y="1022" width="53" height="53" clip-path="url(#small6)"/>

  <text x="72" y="1230" fill="#77827B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12">每款都经过 56 px 桌面尺寸检查</text>
  <text x="1408" y="1230" fill="#77827B" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="end">可从这一组单独选择，也可以与第一组混搭</text>
</svg>
