<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>服务协议</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #efede4;
        --paper: #fcfbf7;
        --ink: #15211c;
        --muted: #75817a;
        --brand: #1d4a3d;
        --line: #e2dfd3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 760px;
        min-height: 100vh;
        margin: 0 auto;
        padding: max(22px, env(safe-area-inset-top)) 18px
          max(28px, env(safe-area-inset-bottom));
      }
      h1 {
        margin: 0 0 14px;
        font: 700 28px/1.3 "Songti SC", "STSong", serif;
      }
      .card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 18px 38px rgb(21 33 28 / 10%);
        white-space: pre-wrap;
        user-select: text;
      }
      .state {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        color: #f4f1e6;
        background: var(--brand);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">服务协议</h1>
      <div id="state" class="state">正在加载…</div>
      <article id="content" class="card" hidden></article>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const type = params.get("type") === "BC_REGISTER_PROTOC"
        ? "BC_REGISTER_PROTOC"
        : "BC_PRIVACY_PROTOC";
      const apiBase = (
        params.get("apiBase") || "https://dmjz.makcabxa02y.icu"
      ).replace(/\/$/, "");
      const operatorName = params.get("operator") || "";
      const contactEmail = params.get("email") || "";
      const title = document.getElementById("title");
      const state = document.getElementById("state");
      const content = document.getElementById("content");
      title.textContent =
        type === "BC_PRIVACY_PROTOC" ? "隐私政策" : "平台注册协议";

      function decode(value) {
        return value
          .replace(/<br\s*\/?>/gi, "\n")
          .replace(/<\/(p|div|h[1-6]|section|blockquote)>/gi, "\n")
          .replace(/<li[^>]*>/gi, "\n• ")
          .replace(/<\/li>/gi, "")
          .replace(/<[^>]+>/g, "")
          .replace(/&nbsp;/g, " ")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function extract(value, depth = 0) {
        if (depth > 8 || value == null) return "";
        if (typeof value === "string") {
          const text = value.trim();
          if (text.startsWith("{") || text.startsWith("[")) {
            try { return extract(JSON.parse(text), depth + 1); } catch {}
          }
          return value;
        }
        if (Array.isArray(value)) {
          return value.map((item) => extract(item, depth + 1)).filter(Boolean).join("\n");
        }
        if (typeof value === "object") {
          for (const key of ["paramValue", "value", "content", "text", "data", "config"]) {
            if (value[key] != null) {
              const text = extract(value[key], depth + 1);
              if (text.trim()) return text;
            }
          }
        }
        return "";
      }

      async function load() {
        state.hidden = false;
        state.textContent = "正在加载…";
        content.hidden = true;
        try {
          const response = await fetch(
            `${apiBase}/mall_admin/ua/app/sys_config/get/value/config/${encodeURIComponent(type)}`
          );
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (payload.code && !["00000", "200"].includes(payload.code)) {
            throw new Error(payload.msg || payload.message || "协议读取失败");
          }
          let text = decode(extract(payload.data ?? payload));
          if (!text) throw new Error("协议内容为空");
          if (operatorName) {
            text = text
              .replaceAll("${name}", operatorName)
              .replaceAll("【运营者名称】", operatorName);
          }
          if (contactEmail) {
            text = text
              .replaceAll("${email}", contactEmail)
              .replaceAll("【联系邮箱】", contactEmail);
          }
          content.textContent = text;
          content.hidden = false;
          state.hidden = true;
        } catch (error) {
          state.textContent = `协议加载失败：${error.message}`;
          const retry = document.createElement("button");
          retry.textContent = "重新加载";
          retry.onclick = load;
          state.append(document.createElement("br"), retry);
        }
      }

      load();
    </script>
  </body>
</html>
